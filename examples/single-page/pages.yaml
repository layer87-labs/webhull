# pages.yaml — single-page site example for webhull
#
# This demonstrates single-page mode: the entire site is one scrollable page at /.
# No slug routing — language is detected from cookie or Accept-Language header.
#
# Run locally:
#   webhull -config deploy/config.yaml -pages examples/single-page/pages.yaml
#
# The key difference from the multi-page example:
#   - id: home uses slug: "" in frontmatter → served at / directly
#   - Navigation items use #anchor hrefs instead of separate page URLs
#   - contact.enabled: true → contact form rendered at #contact after all sections
#   - Language switching uses /?lang=XX links (set cookie, no redirect)

# ── Site identity ─────────────────────────────────────────────────────────────

site:
  name: "Northgate Software"
  baseURL: "${BASE_URL:http://localhost:8080}"
  logoPath: "/static/img/logo.webp"
  faviconPath: "/static/img/favicon.webp"
  copyrightStartYear: 2021
  showLangFlags: true

# ── Internationalisation ──────────────────────────────────────────────────────

i18n:
  defaultLanguage: "de"
  languages: ["de", "en"]

# ── Content directory ─────────────────────────────────────────────────────────
# Each language has one file: content/{lang}/index.html
# The file declares slug: "" so it is served at / in single-page mode.

contentDir: "content"

# ── Navigation ────────────────────────────────────────────────────────────────
# All links are #anchor references into the single page.
# Add legal pages (impressum, datenschutz) as separate slug pages if needed.

navigation:
  header:
    de:
      - title: "Leistungen"
        url: "#leistungen"
      - title: "Über uns"
        url: "#ueber-uns"
    en:
      - title: "Services"
        url: "#services"
      - title: "About"
        url: "#about"
  footer:
    de:
      - title: "Rechtliches"
        url: "#"
        children:
          - title: "Impressum"
            url: "/impressum"
          - title: "Datenschutz"
            url: "/datenschutz"
    en:
      - title: "Legal"
        url: "#"
        children:
          - title: "Imprint"
            url: "/imprint"
          - title: "Privacy"
            url: "/privacy"

# ── UI strings ────────────────────────────────────────────────────────────────

ui:
  de:
    contactURL: "#contact"
    contactLabel: "Kontakt"
    footerTagline: "Software, die bleibt."
    allRights: "Alle Rechte vorbehalten."
    notFoundTitle: "Seite nicht gefunden"
    notFoundSubtitle: "Die gesuchte Seite existiert nicht oder wurde verschoben."
    notFoundButton: "Zur Startseite"
  en:
    contactURL: "#contact"
    contactLabel: "Contact"
    footerTagline: "Software built to last."
    allRights: "All rights reserved."
    notFoundTitle: "Page not found"
    notFoundSubtitle: "The page you are looking for does not exist or has been moved."
    notFoundButton: "Back to home"

# ── Consent banner ────────────────────────────────────────────────────────────

consent:
  enabled: true
  categories:
    necessary:
      required: true
      default: true
    analytics:
      required: false
      default: false
  i18n:
    de:
      title: "Cookie-Einstellungen"
      description: "Wir verwenden Cookies für den Betrieb der Website und zur Analyse."
      acceptAll: "Alle akzeptieren"
      rejectAll: "Alle ablehnen"
      customize: "Anpassen"
      save: "Auswahl speichern"
      categories:
        necessary: "Notwendig"
        analytics: "Analyse"
    en:
      title: "Cookie Settings"
      description: "We use cookies to operate the website and analyse traffic."
      acceptAll: "Accept all"
      rejectAll: "Reject all"
      customize: "Customize"
      save: "Save preferences"
      categories:
        necessary: "Necessary"
        analytics: "Analytics"

# ── SEO defaults ──────────────────────────────────────────────────────────────

seo:
  defaultOGImage: "/static/img/og/default.webp"
  defaultTwitterCard: "summary_large_image"

# ── Contact form ──────────────────────────────────────────────────────────────
# Rendered inline at #contact after all content sections.
# SMTP config lives in deploy/config.yaml.

contact:
  enabled: true
  recipientName: "Northgate Software"
  recipients: ["${CONTACT_EMAIL:hello@example.com}"]
  subject:
    de: "Neue Kontaktanfrage"
    en: "New contact request"
  maxLinks: 3
  rateLimit:
    requests: 3
    window: 15m
