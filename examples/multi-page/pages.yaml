# pages.yaml — site structure for webhull example
#
# This file is baked into the container image alongside content/ and static/.
# It defines WHAT the site is: identity, languages, navigation, UI strings, and
# the content directory path.
#
# Operational settings (server ports, SMTP, analytics, gate secrets) live in
# config.yaml, which is mounted as a Kubernetes ConfigMap at runtime.
#
# Run locally:
#   webhull -config deploy/config.yaml -pages examples/multi-page/pages.yaml

# ── Site identity ─────────────────────────────────────────────────────────────

site:
  name: "Northgate Software"
  baseURL: "${BASE_URL:http://localhost:8080}"
  logoPath: "/static/img/logo.webp"
  faviconPath: "/static/img/favicon.webp"
  copyrightStartYear: 2021
  showLangFlags: true

# ── Internationalisation ──────────────────────────────────────────────────────

i18n:
  defaultLanguage: "en"
  languages: ["en", "de"]

# ── Content directory ─────────────────────────────────────────────────────────
# HTML files with YAML frontmatter. Scanned at startup.
# Structure: content/{lang}/{slug}.html

contentDir: "content"

# ── Navigation ────────────────────────────────────────────────────────────────

navigation:
  header:
    en:
      - title: "Services"
        url: "/services"
        slug: "services"
      - title: "About"
        url: "/about"
        slug: "about"
    de:
      - title: "Leistungen"
        url: "/leistungen"
        slug: "leistungen"
      - title: "Über uns"
        url: "/ueber-uns"
        slug: "ueber-uns"
  footer:
    en:
      - title: "Company"
        url: "#"
        slug: "company"
        children:
          - title: "About"
            url: "/about"
            slug: "about"
          - title: "Contact"
            url: "/contact"
            slug: "contact"
      - title: "Legal"
        url: "#"
        slug: "legal"
        children:
          - title: "Imprint"
            url: "/imprint"
            slug: "imprint"
          - title: "Privacy"
            url: "/privacy"
            slug: "privacy"
    de:
      - title: "Unternehmen"
        url: "#"
        slug: "unternehmen"
        children:
          - title: "Über uns"
            url: "/ueber-uns"
            slug: "ueber-uns"
          - title: "Kontakt"
            url: "/kontakt"
            slug: "kontakt"
      - title: "Rechtliches"
        url: "#"
        slug: "rechtliches"
        children:
          - title: "Impressum"
            url: "/impressum"
            slug: "impressum"
          - title: "Datenschutz"
            url: "/datenschutz"
            slug: "datenschutz"

# ── UI strings ────────────────────────────────────────────────────────────────

ui:
  en:
    contactURL: "/contact"
    contactLabel: "Contact"
    footerTagline: "Software built to last."
    allRights: "All rights reserved."
    imprintURL: "/imprint"
    imprintLabel: "Imprint"
    privacyURL: "/privacy"
    privacyLabel: "Privacy"
    notFoundTitle: "Page not found"
    notFoundSubtitle: "The page you are looking for does not exist or has been moved."
    notFoundButton: "Back to home"
  de:
    contactURL: "/kontakt"
    contactLabel: "Kontakt"
    footerTagline: "Software, die bleibt."
    allRights: "Alle Rechte vorbehalten."
    imprintURL: "/impressum"
    imprintLabel: "Impressum"
    privacyURL: "/datenschutz"
    privacyLabel: "Datenschutz"
    notFoundTitle: "Seite nicht gefunden"
    notFoundSubtitle: "Die gesuchte Seite existiert nicht oder wurde verschoben."
    notFoundButton: "Zur Startseite"

# ── Consent banner ────────────────────────────────────────────────────────────

consent:
  enabled: true
  categories:
    necessary:
      required: true
      default: true
    analytics:
      required: false
      default: false
  i18n:
    en:
      title: "Cookie Settings"
      description: "We use cookies to operate the website and analyse traffic."
      acceptAll: "Accept all"
      rejectAll: "Reject all"
      customize: "Customize"
      save: "Save preferences"
      categories:
        necessary: "Necessary"
        analytics: "Analytics"
    de:
      title: "Cookie-Einstellungen"
      description: "Wir verwenden Cookies für den Betrieb der Website und zur Analyse."
      acceptAll: "Alle akzeptieren"
      rejectAll: "Alle ablehnen"
      customize: "Anpassen"
      save: "Auswahl speichern"
      categories:
        necessary: "Notwendig"
        analytics: "Analyse"

# ── Contact form ──────────────────────────────────────────────────────────────
# enabled here = form is shown. Operational params (rateLimit, maxLinks) have
# sane defaults and can be overridden in config.yaml if needed.

contact:
  enabled: true
  recipientName: "Northgate Software"
  recipients:
    - "hello@northgate-software.example.com"
  subject:
    en: "New contact: {{NAME}}"
    de: "Neue Nachricht: {{NAME}}"

# ── Analytics ─────────────────────────────────────────────────────────────────
# Define analytics here so the site repo owns it. The ops config (config.yaml)
# only needs SMTP credentials — analytics config is baked into the image.

analytics:
  plausible:
    enabled: true
    baseURL: "${PLAUSIBLE_BASE_URL:https://plausible.example.com}"
    scriptPath: "/js/script.hash.outbound-links.pageview-props.tagged-events.js"
    # domain: auto-derived from site.baseURL (northgate-software.example.com)
  collector:
    enabled: false

# ── Mail identity ─────────────────────────────────────────────────────────────
# from/fromName and templates are site identity, not credentials.
# The ops config only provides host, port, username, password, useTLS.

mail:
  # from: auto-derived from site.baseURL → noreply@{domain}
  # fromName: auto-derived from site.name
  templates:
    en:
      subject: "Thank you for your message"
      bodyFile: "mail/en-confirmation.html"
    de:
      subject: "Vielen Dank für Ihre Nachricht"
      bodyFile: "mail/de-confirmation.html"

# ── SEO defaults ──────────────────────────────────────────────────────────────

seo:
  defaultOGImage: "/static/img/og/default.webp"
  defaultTwitterCard: "summary_large_image"
  globalJsonLD:
    - |
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Northgate Software",
        "url": "${BASE_URL:http://localhost:8080}",
        "logo": "${BASE_URL:http://localhost:8080}/static/img/logo.webp"
      }
