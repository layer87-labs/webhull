name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale issues/PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is further activity. If this is still relevant, please leave
            a comment.
          close-issue-message: >
            This issue was closed due to inactivity. Feel free to reopen if it is
            still relevant.

          # PRs
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This PR has been inactive for 30 days. It will be closed in 7 days
            unless there is further activity.
          close-pr-message: >
            This PR was closed due to inactivity. Feel free to reopen if the work
            is still relevant.

          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,wip"
