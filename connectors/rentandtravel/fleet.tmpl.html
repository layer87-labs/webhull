<!--
  rent and travel fleet fragment.

  Rendered server-side via html/template (auto-escaping) and injected via
  webhull's plugin system — see plugin.yaml. Styling is intentionally
  class-only: the consuming site owns the design in its own stylesheet.

  Each card is a button carrying the item's full allowlisted data as JSON
  in data-vehicle (see the toJSON helper). Clicking it opens a shared
  <dialog> — a gallery + full specs — built entirely from that data, no
  extra request. "Jetzt buchen" links out to the vehicle's real booking
  page on rent and travel (wl.be.rentandtravel.de), built from the item's
  own id and station.id — no separate detail route needed on this side.

  REQUIRED SETUP STEP: copy fleet.js from this directory into the
  consuming site's static assets so it resolves at
  /static/js/rentandtravel-fleet.js — see README. The dialog's JS ships
  as an external file, not inline, because webhull's default CSP has no
  'unsafe-inline'/nonce for script-src; an inline <script> here is
  silently dropped by the browser.
-->
<div class="fleet-grid">
  {{range .Items}}
  <article class="fleet-card">
    <button type="button" class="fleet-card-link" data-vehicle='{{toJSON .}}' aria-haspopup="dialog">
      {{if index . "images.outside.medium"}}
      <img class="fleet-card-img"
           src="{{index . "images.outside.medium"}}"
           alt="{{index . "make"}} {{index . "model"}}"
           loading="lazy" width="400" height="280">
      {{end}}

      <span class="fleet-card-body">
        {{if index . "labels"}}
        <span class="fleet-card-labels">
          {{range index . "labels"}}<span class="fleet-badge">{{.}}</span>{{end}}
        </span>
        {{end}}

        <span class="fleet-card-title">{{index . "make"}} {{index . "model"}}</span>
        <span class="fleet-card-group">{{index . "group"}}</span>

        <span class="fleet-card-specs">
          <span>{{index . "seats"}} Sitzplätze</span>
          <span>{{index . "beds"}} Schlafplätze</span>
          <span>Führerschein {{index . "driversLicence"}}</span>
        </span>

        <span class="fleet-card-price">
          {{with index . "pricePerNightFrom"}}ab {{.}} €{{end}} / Nacht
        </span>
        <span class="fleet-card-cta">Details &amp; Galerie ansehen</span>
      </span>
    </button>
  </article>
  {{else}}
  <p class="fleet-empty">Aktuell sind keine Fahrzeuge verfügbar.</p>
  {{end}}
</div>

<dialog class="fleet-dialog" id="fleet-detail-dialog">
  <div class="fleet-dialog-inner">
    <button type="button" class="fleet-dialog-close" data-fleet-close aria-label="Schließen">✕</button>
    <div class="fleet-dialog-gallery">
      <img class="fleet-dialog-img" id="fleet-dialog-img" alt="">
      <div class="fleet-dialog-thumbs" id="fleet-dialog-thumbs"></div>
    </div>
    <div class="fleet-dialog-body">
      <p class="fleet-card-labels" id="fleet-dialog-labels"></p>
      <h3 id="fleet-dialog-title"></h3>
      <p class="fleet-card-group" id="fleet-dialog-group"></p>
      <ul class="fleet-card-specs fleet-card-specs--dialog" id="fleet-dialog-specs"></ul>
      <ul class="fleet-card-features" id="fleet-dialog-features"></ul>
      <p class="fleet-card-intro" id="fleet-dialog-intro"></p>
      <h4 class="fleet-dialog-subhead" id="fleet-dialog-tech-head" hidden>Technische Daten</h4>
      <dl class="fleet-dialog-tech" id="fleet-dialog-tech"></dl>

      <h4 class="fleet-dialog-subhead" id="fleet-dialog-cal-head" hidden>Verfügbarkeit</h4>
      <div class="fleet-cal" id="fleet-cal" hidden>
        <div class="fleet-cal-nav">
          <button type="button" class="fleet-cal-nav-btn" id="fleet-cal-prev" aria-label="Vorheriger Monat">←</button>
          <span class="fleet-cal-month" id="fleet-cal-month"></span>
          <button type="button" class="fleet-cal-nav-btn" id="fleet-cal-next" aria-label="Nächster Monat">→</button>
        </div>
        <div class="fleet-cal-weekdays">
          <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
        </div>
        <div class="fleet-cal-grid" id="fleet-cal-grid"></div>
        <div class="fleet-cal-legend">
          <span><i class="fleet-cal-swatch fleet-cal-swatch--available"></i> Verfügbar</span>
          <span><i class="fleet-cal-swatch fleet-cal-swatch--no-pickup"></i> Keine Abholung möglich</span>
          <span><i class="fleet-cal-swatch fleet-cal-swatch--no-return"></i> Keine Rückgabe möglich</span>
          <span><i class="fleet-cal-swatch fleet-cal-swatch--unavailable"></i> Nicht verfügbar</span>
        </div>
      </div>

      <p class="fleet-card-price" id="fleet-dialog-price"></p>
      <a class="btn btn--gold btn--lg" id="fleet-dialog-book" target="_blank" rel="noopener">
        Jetzt bei rent and travel buchen
      </a>
    </div>
  </div>
</dialog>


<!--
  Served externally, same-origin, not inline — see fleet.js's header
  comment: webhull's default CSP has no 'unsafe-inline'/nonce for
  script-src, so an inline <script> here would be silently dropped by the
  browser. Copy fleet.js from this connector into the consuming site's
  static directory (see README) so it resolves at this path.
-->
<script src="/static/js/rentandtravel-fleet.js" defer></script>
