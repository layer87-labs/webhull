{{- if .Values.gateway.enabled }}
---
# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhull.fullname" . }}-redirect
  labels:
    {{- include "webhull.labels" . | nindent 4 }}
spec:
  hostnames:
  - {{ .Values.gateway.host | quote }}
  {{- range .Values.gateway.additionalHosts }}
  - {{ . | quote }}
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" . }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: {{ .Values.gateway.sectionNameHttp | default "http" }}
  {{- range $i, $host := .Values.gateway.additionalHosts }}
  {{- if $.Values.gateway.create }}
  # HTTP listener for additional host — named http-<host-with-dashes> by the gateway template
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    sectionName: "http-{{ $host | replace "." "-" }}"
  {{- else }}
  # Shared gateway: additional HTTP listeners are not created per-host;
  # the apex HTTP listener covers www redirects via host matching at the gateway level.
  # No extra parentRef needed for HTTP on shared gateways.
  {{- end }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Main HTTPS route — all traffic to webhull
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhull.fullname" . }}
  labels:
    {{- include "webhull.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.gateway.host }}
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  hostnames:
  - {{ .Values.gateway.host | quote }}
  {{- range .Values.gateway.additionalHosts }}
  - {{ . | quote }}
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" . }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: {{ .Values.gateway.sectionNameHttps | default "https" }}
  {{- range $i, $host := .Values.gateway.additionalHosts }}
  {{- if $.Values.gateway.create }}
  # Self-managed gateway: listener is named https-<host-with-dashes>
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    sectionName: "https-{{ $host | replace "." "-" }}"
  {{- else }}
  # Shared external gateway: listeners follow the https-additional-<index> naming
  # convention used by the centrally-managed Gateway resources in istio-ingress.
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    sectionName: "https-additional-{{ $i }}"
  {{- end }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "webhull.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
