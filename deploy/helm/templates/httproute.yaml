{{- if .Values.gateway.enabled }}
---
# HTTP → HTTPS redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhull.fullname" . }}-redirect
  labels:
    {{- include "webhull.labels" . | nindent 4 }}
spec:
  hostnames:
  - {{ .Values.gateway.host | quote }}
  {{- range .Values.gateway.additionalHosts }}
  - {{ . | quote }}
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" . }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: {{ .Values.gateway.sectionNameHttp | default "http" }}
  {{- range $i, $host := .Values.gateway.additionalHosts }}
  {{- if $.Values.gateway.create }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    sectionName: "http-{{ $host | replace "." "-" }}"
  {{- else if $.Values.gateway.additionalSectionNamesHttp }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    sectionName: {{ index $.Values.gateway.additionalSectionNamesHttp $i | quote }}
  {{- end }}
  {{- end }}
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Main HTTPS route — all traffic to webhull
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "webhull.fullname" . }}
  labels:
    {{- include "webhull.labels" . | nindent 4 }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.gateway.host }}
    {{- with .Values.gateway.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  hostnames:
  - {{ .Values.gateway.host | quote }}
  {{- range .Values.gateway.additionalHosts }}
  - {{ . | quote }}
  {{- end }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" . }}
    namespace: {{ .Values.gateway.namespace }}
    sectionName: {{ .Values.gateway.sectionNameHttps | default "https" }}
  {{- range $i, $host := .Values.gateway.additionalHosts }}
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "webhull.gatewayName" $ }}
    namespace: {{ $.Values.gateway.namespace }}
    {{- if $.Values.gateway.create }}
    sectionName: "https-{{ $host | replace "." "-" }}"
    {{- else if $.Values.gateway.additionalSectionNamesHttps }}
    sectionName: {{ index $.Values.gateway.additionalSectionNamesHttps $i | quote }}
    {{- else }}
    sectionName: "https-additional-{{ $i }}"
    {{- end }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "webhull.fullname" . }}
      port: {{ .Values.service.port }}
{{- end }}
