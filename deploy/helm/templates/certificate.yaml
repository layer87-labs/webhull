{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "webhull.fullname" . }}
  labels:
    {{- include "webhull.labels" . | nindent 4 }}
spec:
  secretName: {{ include "webhull.tlsSecretName" . }}
  issuerRef:
    name: {{ .Values.certificate.issuerName }}
    kind: {{ .Values.certificate.issuerKind }}
  dnsNames:
  - {{ .Values.gateway.host | quote }}
  {{- range .Values.gateway.additionalHosts }}
  - {{ . | quote }}
  {{- end }}
{{- end }}
