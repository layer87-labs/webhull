# Operational Configuration — environment-specific overrides
#
# Mounted at runtime via Helm ConfigMap. Only set what differs from defaults.
# Site structure (pages, redirects, navigation, consent, analytics, seo) lives in pages.yaml.
#
# All ${VAR:default} references are expanded at runtime from environment variables.
# All sections below have sane defaults — only override what you need.

# ── Server ────────────────────────────────────────────────────────────────────
# Defaults: port 8080, host 0.0.0.0, timeouts 15s/15s/60s/30s, cache 1h/1y
# server:
#   port: "${PORT:8080}"
#   environment: "${ENVIRONMENT:production}"
#   staticDir: "static"
#   # Behind a reverse proxy / ingress: list only the address range of the
#   # proxy directly in front of webhull (not a whole cluster or VPC range) so
#   # the client IP is read from X-Forwarded-For, and make sure (e.g. with a
#   # NetworkPolicy) that nothing else reaches webhull directly.
#   # Empty (default) trusts no proxy.
#   trustedProxies:
#     - "192.0.2.0/24"   # replace with your ingress / load balancer CIDR

# ── Health ────────────────────────────────────────────────────────────────────
# Defaults: enabled, port 8082, /health, /ready, /metrics, 5s timeout
# serviceName auto-derived from site.baseURL domain
# health:
#   serviceVersion: "${APP_VERSION:dev}"

# ── Mail (SMTP credentials) ──────────────────────────────────────────────────
# from/fromName/templates are defined in pages.yaml (site identity).
# Only connection details needed here.
mail:
  host: "${SMTP_HOST:localhost}"
  port: ${SMTP_PORT:587}
  username: "${SMTP_USERNAME:}"
  password: "${SMTP_PASSWORD:}"
  useTLS: ${SMTP_TLS:true}

# ── Contact ───────────────────────────────────────────────────────────────────
# enabled is set in pages.yaml. Only operational params here.
# Defaults: maxLinks 2, rateLimit 3 req / 15 min per client IP,
# autoReplyRateLimit 20 / 1h across all visitors, maxBodyBytes 32 KiB
# contact:
#   maxLinks: 2
#   rateLimit:
#     requests: 3
#     window: 15m
#   autoReplyRateLimit:
#     requests: 20
#     window: 1h
#   maxBodyBytes: 32768

# ── Gate (optional) ──────────────────────────────────────────────────────────
