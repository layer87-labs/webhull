# Operational Configuration — 12-factor, environment-dependent
# All ${VAR:default} references are expanded at runtime from environment variables.
#
# This file is deployed via Helm ConfigMap and can differ per environment.
# Site structure (pages, navigation, UI strings) lives in pages.yaml (baked into the image).

server:
  port: "${PORT:8080}"
  host: "0.0.0.0"
  environment: "${WEBCORE_ENVIRONMENT:production}"
  readTimeout: 15s
  writeTimeout: 15s
  idleTimeout: 60s
  shutdownTimeout: 30s
  staticDir: "static"
  cacheMaxAge: 1h
  staticCacheMaxAge: 8760h

health:
  enabled: true
  host: "0.0.0.0"
  port: 8082
  healthPath: "/health"
  readyPath: "/ready"
  metricsPath: "/metrics"
  timeout: 5s
  serviceName: "webhull"
  serviceVersion: "${APP_VERSION:dev}"

mail:
  host: "${SMTP_HOST:localhost}"
  port: 587
  username: "${SMTP_USERNAME:}"
  password: "${SMTP_PASSWORD:}"
  from: "${SMTP_FROM:noreply@example.com}"
  fromName: "${SMTP_FROM_NAME:My Site}"
  useTLS: true

analytics:
  plausible:
    enabled: true
    baseURL: "${PLAUSIBLE_BASE_URL:https://plausible.example.com}"
    scriptPath: "/js/script.hash.outbound-links.pageview-props.tagged-events.js"
    domain: "${PLAUSIBLE_DOMAIN:example.com}"
  collector:
    enabled: false

consent:
  enabled: true
  categories:
    necessary:
      required: true
      default: true
    analytics:
      required: false
      default: false

seo:
  defaultOGImage: "/static/img/logo.webp"
  defaultTwitterCard: "summary"

