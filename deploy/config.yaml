# Operational Configuration — environment-specific overrides
#
# Mounted at runtime via Helm ConfigMap. Only set what differs from defaults.
# Site structure (pages, navigation, consent, analytics, seo) lives in pages.yaml.
#
# All ${VAR:default} references are expanded at runtime from environment variables.
# All sections below have sane defaults — only override what you need.

# ── Server ────────────────────────────────────────────────────────────────────
# Defaults: port 8080, host 0.0.0.0, timeouts 15s/15s/60s/30s, cache 1h/1y
# server:
#   port: "${PORT:8080}"
#   environment: "${ENVIRONMENT:production}"
#   staticDir: "static"

# ── Health ────────────────────────────────────────────────────────────────────
# Defaults: enabled, port 8082, /health, /ready, /metrics, 5s timeout
# serviceName auto-derived from site.baseURL domain
# health:
#   serviceVersion: "${APP_VERSION:dev}"

# ── Mail (SMTP credentials) ──────────────────────────────────────────────────
# from/fromName/templates are defined in pages.yaml (site identity).
# Only connection details needed here.
mail:
  host: "${SMTP_HOST:localhost}"
  port: ${SMTP_PORT:587}
  username: "${SMTP_USERNAME:}"
  password: "${SMTP_PASSWORD:}"
  useTLS: ${SMTP_TLS:true}

# ── Contact ───────────────────────────────────────────────────────────────────
# enabled is set in pages.yaml. Only operational params here.
# Defaults: maxLinks 2, rateLimit 3 req / 15 min
# contact:
#   maxLinks: 2
#   rateLimit:
#     requests: 3
#     window: 15m

# ── Gate (optional) ──────────────────────────────────────────────────────────
